<div class="auth-page">
    <div class="auth-card">
        <h2 class="auth-title">Iniciar Sesión</h2>
        <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" formControlName="email" id="email">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" formControlName="password">
            </div>

            @if (errorMessage()) {
                <div class="msg msg-error">{{ errorMessage() }}</div>
            }

            <button class="auth-btn" type="submit" [disabled]="loginForm.invalid || isLoading()">
                {{ isLoading() ? 'Ingresando...' : 'Entrar' }}
            </button>

            <p class="auth-footer">
                ¿No tenés cuenta? <a routerLink="/register">Registrate acá</a>
            </p>
        </form>
    </div>
</div>
