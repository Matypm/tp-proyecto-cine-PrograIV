<div class="auth-page">
    <div class="auth-card">
        <h2 class="auth-title">Crear Cuenta</h2>
        <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="registrarUsuario()">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" formControlName="nombre">
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" formControlName="apellido">
                </div>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" formControlName="email">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" formControlName="password">
            </div>
            <div class="form-group">
                <label for="fecha_nacimiento">Fecha de Nacimiento</label>
                <input type="text" id="fecha_nacimiento"
                    formControlName="fecha_nacimiento"
                    placeholder="YYYY-MM-DD">
            </div>

            @if (errorMessage()) {
                <div class="msg msg-error">{{ errorMessage() }}</div>
            }

            @if (succesMessage()) {
                <div class="msg msg-success">{{ succesMessage() }}</div>
            }

            <button class="auth-btn" type="submit"
                [disabled]="registerForm.invalid || isLoading()">
                {{ isLoading() ? 'Registrando...' : 'Registrarse' }}
            </button>

            <p class="auth-footer">
                ¿Ya tenés cuenta? <a routerLink="/login">Iniciar Sesión</a>
            </p>
        </form>
    </div>
</div>
