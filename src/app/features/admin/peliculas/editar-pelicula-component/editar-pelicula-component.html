<section class="editar-pelicula">

    <div class="encabezado">
        <h1>EDITAR PELÍCULA</h1>
        <p>Modificá los datos de la película.</p>
    </div>

    <form [formGroup]="formPeliculaEdicion" (ngSubmit)="editarPelicula()">

        <div class="campo">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" formControlName="nombre" placeholder="Nombre de la película">
        </div>

        <div class="campo">
            <label for="sinopsis">Sinopsis</label>
            <textarea id="sinopsis" formControlName="sinopsis" placeholder="Sinopsis de la película"></textarea>
        </div>

        <div class="campo">
            <label for="duracion">Duración</label>
            <input id="duracion" type="number" formControlName="duracion" min="30" placeholder="Duración en minutos">
        </div>

        <div class="campo">
            <label for="edad_restriccion">Restricción de edad</label>
            <input id="edad_restriccion" type="number" formControlName="edad_restriccion" min="0" max="18">
        </div>

        <div class="campo">
            <label>Géneros</label>

            <div class="generos">
                @for (genero of generos(); track genero.id) {
                    <button
                        class="genero-btn"
                        type="button"
                        (click)="seleccionarGenero(genero.id!)"
                        [class.seleccionado]="generosSeleccionados().includes(genero.id!)">
                        {{ genero.nombre }}
                    </button>
                }
            </div>
        </div>

        <div class="campo">
            <label for="imagen">Imagen</label>
            <input id="imagen" type="file" accept="image/*" (change)="seleccionarImagen($event)">

            @if (imagenPreview()) {
                <div class="preview">
                    <img [src]="imagenPreview()" alt="Vista previa de la película">
                </div>
            } @else if (imagenActual()) {
                <div class="preview">
                    <img [src]="imagenActual()!" alt="Imagen actual de la película">
                </div>
            }
        </div>

        <button class="submit-btn" type="submit">
            GUARDAR CAMBIOS
        </button>

    </form>

</section>
