<div class="pago-container">

    <section class="informacion-pago">

        <div class="pago-header">
            <h2 class="titulo-pago">INFORMACIÓN DE PAGO</h2>
            <button class="cancelar-btn" (click)="cancelarCompra()">
                ✕ CANCELAR COMPRA
            </button>
        </div>

        <h3 class="subtitulo">DATOS DEL CLIENTE</h3>

        @if (currentUser()) {
            <div class="datos-cliente">

                <div class="campo">
                    <label>Nombre</label>
                    <input type="text" [value]="currentPerfil()?.nombre" readonly>
                </div>

                <div class="campo">
                    <label>Apellido</label>
                    <input type="text" [value]="currentPerfil()?.apellido" readonly>
                </div>

                <div class="campo campo-email">
                    <label>Email</label>
                    <input type="email" [value]="currentUser()?.email" readonly>
                </div>

            </div>
        } @else {
            <form [formGroup]="formCliente">
                <div class="datos-cliente">

                    <div class="campo">
                        <label>Nombre</label>
                        <input type="text" formControlName="nombre" placeholder="Ingresá tu nombre">
                    </div>

                    <div class="campo">
                        <label>Apellido</label>
                        <input type="text" formControlName="apellido" placeholder="Ingresá tu apellido">
                    </div>

                    <div class="campo campo-email">
                        <label>Email</label>
                        <input type="email" formControlName="email" placeholder="Ingresá tu email">
                    </div>

                </div>
            </form>
        }

        <div class="cupon">

            <h3 class="subtitulo">CUPÓN</h3>

            <div class="cupon-form">
                <input
                    type="text"
                    placeholder="Ingresá tu cupón"
                    [value]="codigoCupon()"
                    (input)="codigoCupon.set($any($event.target).value)">

                <button class="aplicar-btn" type="button" (click)="aplicarCupon()">
                    APLICAR
                </button>
            </div>

            @if (mensajeCupon()) {
                <p class="msj-cupon">{{ mensajeCupon() }}</p>
            }

        </div>

    </section>

    <app-resumen-compra
        [funcion]="funcion()"
        [pelicula]="pelicula()"
        [datosCliente]="datosCliente()"
        (confirmarCompra)="procesarCompra()"
        pantalla="pago">
    </app-resumen-compra>

</div>
